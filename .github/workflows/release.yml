# Stages a DRAFT GitHub Release in the shape the OIE Community Store expects
# (extension zip + .sha256 sidecar), on a semver tag:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# CI stages the release; a human reviews the assets and notes and clicks
# Publish. The draft also protects against a re-pushed tag silently
# overwriting a published release's assets. Publishing fires
# catalog-pr.yml (see that workflow) for the optional community-catalog PR.
#
# The tag drives the Maven version via -Drevision, so plugin.xml's pluginVersion
# (what the engine reports as "installed") matches oie.json, keeping store
# update detection accurate. oie.json at the repo root is verified against the
# tag before anything builds.
#
# Store discovery needs no registry step at all: any OIE Community Store that
# lists this repository (or its owning account with the `oie-plugin` topic)
# reads oie.json and these release assets directly once published.
#
# Supply chain:
#   * Every action is pinned to a full commit SHA, not a mutable tag. The
#     trailing `# vX.Y.Z` comment is documentation only; the SHA is what runs.
#   * The engine distribution tarball is the single external input the build
#     trusts, so its sha256 is pinned in OIE_TARBALL_SHA256 and verified on
#     every run, cache hits included. A mismatch fails the release.
#   * The engine is the 4.6.0 GA release, matching oie.json's minEngineVersion.
#     Never cut a release against a release-candidate engine.
#   * The `.sha256` sidecar is self-attesting — anyone able to replace the zip
#     can replace the sidecar — so it is a convenience, not evidence. The real
#     integrity statement is the Sigstore-backed build provenance attestation
#     produced below, which binds the zip's digest to this workflow, this
#     repository and this commit. Consumers verify it with:
#
#       gh attestation verify sentinel-<version>.zip -R <owner>/<repo>
#
#     That is why this workflow holds id-token/attestations write.

name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual re-run. A tag push is a one-shot event: if it is lost — a GitHub
  # Actions incident swallowing the trigger is the case this was added for —
  # the only other way back in is deleting and re-pushing the tag, which is a
  # poor thing to have to do to a release tag people may already have fetched.
  #
  # Run this against the TAG, not a branch: the version comes from the ref
  # name. Choosing a branch means the ref is "main", which fails the oie.json
  # version check below rather than building something mislabelled.
  workflow_dispatch:

permissions:
  contents: write        # required to create the GitHub Release
  id-token: write        # OIDC token used to sign the provenance attestation
  attestations: write    # required to store the attestation on the repository

env:
  OIE_TAG: v4.6.0
  OIE_TARBALL: oie_unix_4_6_0.tar.gz
  # sha256 of the published oie_unix_4_6_0.tar.gz asset on the v4.6.0 release.
  # Cross-checked against the release's own `sha256sums` manifest. Update this
  # in the same commit as OIE_TAG/OIE_TARBALL, never separately.
  OIE_TARBALL_SHA256: 7c82e79027e671277e1d78d0f7bbb1c53ddf1be476f1e80c2ddbfcf7855900ea
  MC_VERSION: '4.6.0'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # JDK 21: the 4.6.0 engine jars are Java 21 bytecode (the plugin itself
      # still targets --release 17); build.sh enforces this.
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Resolve and verify version
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION="$(jq -r .version oie.json)"; MANIFEST_VERSION="${MANIFEST_VERSION#v}"
          if [ "$VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} implies version $VERSION but oie.json says $MANIFEST_VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # The digest is part of the cache key so a change to the pinned checksum
      # can never be served a stale entry built from the old tarball.
      - name: Cache OIE distribution
        id: oie-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.OIE_TARBALL }}
          key: oie-dist-${{ env.OIE_TAG }}-${{ env.OIE_TARBALL_SHA256 }}

      - name: Download OIE distribution
        if: steps.oie-cache.outputs.cache-hit != 'true'
        run: curl -fSL -o "$OIE_TARBALL" "https://github.com/OpenIntegrationEngine/engine/releases/download/${OIE_TAG}/${OIE_TARBALL}"

      # Runs on both paths (fresh download and cache hit) — see the header note.
      - name: Verify OIE distribution checksum
        run: |
          echo "${OIE_TARBALL_SHA256}  ${OIE_TARBALL}" | sha256sum -c -

      # The same four jars scripts/install-engine-jars.sh installs from a local
      # engine checkout, taken from the published distribution instead. The GA
      # tarball's layout is identical to the rc1 one this used to read.
      - name: Install engine jars into the local Maven repo
        run: |
          tar xzf "$OIE_TARBALL" \
            oie/server-lib/mirth-server.jar \
            oie/server-lib/mirth-crypto.jar \
            oie/server-lib/mirth-client-core.jar \
            oie/server-lib/donkey/donkey-server.jar
          for pair in \
            "mirth-server:oie/server-lib/mirth-server.jar" \
            "mirth-crypto:oie/server-lib/mirth-crypto.jar" \
            "mirth-client-core:oie/server-lib/mirth-client-core.jar" \
            "donkey-server:oie/server-lib/donkey/donkey-server.jar"; do
            a="${pair%%:*}"; p="${pair#*:}"
            mvn -q install:install-file -Dfile="$p" -DgroupId=com.mirth.connect -DartifactId="$a" -Dversion="$MC_VERSION" -Dpackaging=jar
          done

      # Keep the (cosmetic) web plugin.json version in step with the release too.
      - name: Stamp web plugin version
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          sed -i "s|\"version\":[[:space:]]*\"[^\"]*\"|\"version\": \"${VERSION}\"|" webadmin/plugin.json

      - name: Build plugin bundle
        run: ./build.sh -Drevision="${{ steps.ver.outputs.version }}"

      - name: Stage the release asset and checksum
        id: pkg
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          SRC="$(find package/target -maxdepth 1 -name 'sentinel-*.zip' | head -n1)"
          if [ -z "$SRC" ]; then
            echo "::error::No plugin zip found in package/target"; ls -l package/target || true; exit 1
          fi
          ASSET="sentinel-${VERSION}.zip"
          mkdir -p out
          cp "$SRC" "out/${ASSET}"
          ( cd out && sha256sum "${ASSET}" > "${ASSET}.sha256" )
          echo "asset=${ASSET}" >> "$GITHUB_OUTPUT"

      # Signed, Sigstore-backed statement that this exact zip came out of this
      # workflow at this commit. Unlike the .sha256 sidecar it cannot be forged
      # by whoever can overwrite the release assets. Runs before the release is
      # created so a failure here means no draft is staged at all.
      - name: Attest build provenance for the release asset
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: out/${{ steps.pkg.outputs.asset }}

      # Draft: CI stages the release; a human reviews and publishes it.
      - name: Create draft GitHub Release with assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
          files: |
            out/${{ steps.pkg.outputs.asset }}
            out/${{ steps.pkg.outputs.asset }}.sha256
          # Tags like v0.2.0-rc1 publish as pre-releases (store beta channel only).
          prerelease: ${{ contains(github.ref_name, '-') }}
